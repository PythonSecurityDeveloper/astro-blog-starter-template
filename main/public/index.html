<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exclusive Product Reveal</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div id="gatekeeper-ui">
        <h2>Verify you are human to access the reveal</h2>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADn0CoXzp4rdTzhL" data-callback="onVerify"></div>
    </div>

    <script>
        // This fires automatically when the user passes the check
        async function onVerify(token) {
            const response = await fetch('/api/reveal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });

            if (response.ok) {
                // Inject the real, decrypted HTML directly into the page
                document.open();
                document.write(await response.text());
                document.close();
            } else {
                alert("Access Denied.");
            }
        }
    </script>
</body>
</html>
